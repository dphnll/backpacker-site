<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d55" />
    <title>Страница не найдена — Backpacker</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/backpacker-site/assets/logo.svg" type="image/svg+xml" />
    <!-- GitHub Pages отдаёт этот файл с любого пути, поэтому ссылки здесь
         абсолютные от корня project pages, а не относительные. -->
    <link rel="stylesheet" href="/backpacker-site/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/backpacker-site/">
          <img src="/backpacker-site/assets/logo.svg" alt="" width="22" height="26" />
          <span>BACKPACKER</span>
        </a>
      </div>
    </header>

    <main class="doc">
      <div class="wrap">
        <div class="doc-sheet">
          <h1>Такой страницы нет</h1>
          <p>
            Возможно, адрес изменился или в ссылке опечатка. Вернитесь на главную или откройте Backpacker.
          </p>
          <p style="margin-top: 24px">
            <a class="btn btn-primary" href="/backpacker-site/">На главную</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <ul class="footer-links">
          <li><a href="/backpacker-site/privacy/">Политика конфиденциальности</a></li>
        </ul>
        <p class="copyright">© 2026 Backpacker</p>
      </div>
    </footer>
  </body>
</html>
