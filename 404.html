<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d55" />
    <title>Страница не найдена — Clavelo</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/clavelo-mark-simple.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
    <!-- Cloudflare Pages отдаёт этот файл с любого пути, поэтому ссылки здесь
         абсолютные от корневого домена, а не относительные. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" aria-label="Clavelo">
          <img src="/assets/logo.svg" alt="" width="116" height="28" />
        </a>
      </div>
    </header>

    <main class="doc">
      <div class="wrap">
        <div class="doc-sheet">
          <h1>Такой страницы нет</h1>
          <p>
            Возможно, адрес изменился или в ссылке опечатка. Вернитесь на главную или откройте Clavelo.
          </p>
          <p style="margin-top: 24px">
            <a class="btn btn-primary" href="/">На главную</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <ul class="footer-links">
          <li><a href="/privacy/">Политика конфиденциальности</a></li>
        </ul>
        <p class="copyright">© 2026 Clavelo</p>
      </div>
    </footer>
  </body>
</html>
